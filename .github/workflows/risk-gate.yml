# CI/CD Risk Gate
#
#   1. collect change statistics from the commit diff
#   2. ask the prediction service for a risk score
#   3. apply the gating policy (shadow / warn / block)
#   4. run the real build and tests
#   5. report the real outcome back, so the history stays current
#
# Human override: in block mode, a commit whose message contains
# [override-gate] is allowed through with a warning. Without this, a pipeline
# that has been failing can never recover, because blocked builds never run and
# so never report the passing outcome that would lower the risk.

name: Build with Risk Gate

on:
  push:
    branches: [main]

env:
  PREDICT_URL: ${{ secrets.PREDICT_URL }}
  POLICY: warn        # shadow | warn | block

jobs:
  risk-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Collect code-change features
        id: features
        run: |
          DIFF=$(git diff --numstat HEAD~1 HEAD || echo "")

          SRC_CHURN=0; TEST_CHURN=0
          SRC_FILES=0; DOC_FILES=0; OTHER_FILES=0

          while IFS=$'\t' read -r added deleted path; do
            [ -z "$path" ] && continue
            [ "$added" = "-" ] && continue
            CHURN=$((added + deleted))
            case "$path" in
              *test*|*spec*|*Test*|*Spec*)
                TEST_CHURN=$((TEST_CHURN + CHURN)) ;;
              *.md|*.txt|*.rst|docs/*)
                DOC_FILES=$((DOC_FILES + 1)) ;;
              *.rb|*.java|*.py|*.js|*.ts|*.go)
                SRC_CHURN=$((SRC_CHURN + CHURN)); SRC_FILES=$((SRC_FILES + 1)) ;;
              *)
                OTHER_FILES=$((OTHER_FILES + 1)) ;;
            esac
          done <<< "$DIFF"

          FILES_MODIFIED=$(git diff --name-only HEAD~1 HEAD | wc -l)
          SLOC=$(find . -name '*.py' -not -path './.git/*' | xargs cat 2>/dev/null | wc -l)

          {
            echo "src_churn=$SRC_CHURN"
            echo "test_churn=$TEST_CHURN"
            echo "src_files=$SRC_FILES"
            echo "doc_files=$DOC_FILES"
            echo "other_files=$OTHER_FILES"
            echo "files_modified=$FILES_MODIFIED"
            echo "sloc=${SLOC:-0}"
          } >> "$GITHUB_OUTPUT"

      - name: Request risk score
        id: predict
        run: |
          PAYLOAD=$(jq -n \
            --arg project "${{ github.repository }}" \
            --arg ref "${{ github.sha }}" \
            --arg branch "${{ github.ref_name }}" \
            --argjson src "${{ steps.features.outputs.src_churn }}" \
            --argjson test "${{ steps.features.outputs.test_churn }}" \
            --argjson mod "${{ steps.features.outputs.files_modified }}" \
            --argjson srcf "${{ steps.features.outputs.src_files }}" \
            --argjson docf "${{ steps.features.outputs.doc_files }}" \
            --argjson othf "${{ steps.features.outputs.other_files }}" \
            --argjson sloc "${{ steps.features.outputs.sloc }}" \
            '{project: $project, build_ref: $ref, branch: $branch,
              git_diff_src_churn: $src, git_diff_test_churn: $test,
              gh_diff_files_modified: $mod, gh_diff_src_files: $srcf,
              gh_diff_doc_files: $docf, gh_diff_other_files: $othf,
              gh_sloc: $sloc, is_pr: false, language: "ruby"}')

          RESPONSE=$(curl -sS --fail --max-time 30 -X POST "$PREDICT_URL/predict" \
                       -H 'Content-Type: application/json' \
                       -H 'ngrok-skip-browser-warning: true' \
                       -d "$PAYLOAD") || {
            echo "::warning::Prediction service unreachable - allowing build (fail-open)"
            echo "risk_score=0" >> "$GITHUB_OUTPUT"
            echo "decision=UNAVAILABLE" >> "$GITHUB_OUTPUT"
            exit 0
          }

          SCORE=$(echo "$RESPONSE" | jq -r '.risk_score')
          DECISION=$(echo "$RESPONSE" | jq -r '.decision')
          echo "risk_score=$SCORE" >> "$GITHUB_OUTPUT"
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"

          {
            echo "## Deployment Risk Assessment"
            echo ""
            echo "**Risk score:** $SCORE"
            echo "**Decision:** $DECISION"
            echo "**Policy:** $POLICY"
            echo "**Builds on record:** $(echo "$RESPONSE" | jq -r '.builds_in_history')"
            echo ""
            echo "### Contributing factors"
            echo "$RESPONSE" | jq -r '.top_factors[] |
              "- `\(.feature)` = \(.value) (contribution \(.contribution))"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply gating policy
        env:
          SCORE: ${{ steps.predict.outputs.risk_score }}
          DECISION: ${{ steps.predict.outputs.decision }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          case "$POLICY" in
            shadow)
              echo "SHADOW: risk $SCORE ($DECISION) - logged, build proceeds"
              ;;
            warn)
              if [ "$DECISION" = "HIGH_RISK" ]; then
                echo "::warning title=High deployment risk::Risk $SCORE - review before merging"
              fi
              ;;
            block)
              if [ "$DECISION" = "HIGH_RISK" ]; then
                if printf '%s' "$COMMIT_MSG" | grep -qF '[override-gate]'; then
                  echo "::warning title=Gate overridden::Risk $SCORE exceeded the threshold but the commit requested an override"
                else
                  echo "::error title=Build blocked::Risk $SCORE exceeds threshold. Add [override-gate] to the commit message to proceed."
                  exit 1
                fi
              fi
              ;;
          esac

  build:
    needs: risk-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run build and tests
        id: build
        continue-on-error: true
        run: |
          pip install --quiet pytest flask
          pytest webapp -v

      - name: Report outcome to prediction service
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          FAILED=false
          [ "$BUILD_OUTCOME" = "failure" ] && FAILED=true
          echo "Build outcome: $BUILD_OUTCOME -> reporting failed=$FAILED"
          curl -sS --max-time 30 -X POST "$PREDICT_URL/outcome" \
            -H 'Content-Type: application/json' \
            -H 'ngrok-skip-browser-warning: true' \
            -d "{\"project\":\"${{ github.repository }}\",\"build_ref\":\"${{ github.sha }}\",\"failed\":$FAILED}" \
            || echo "::warning::Could not report outcome - history will be incomplete"

      - name: Propagate build result
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error title=Tests failed::The build failed its tests"
          exit 1
